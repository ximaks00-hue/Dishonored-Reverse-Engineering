name: REV-0004 vtable evidence records
on:
  pull_request:
  push:
    branches: ["research/**"]
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -p 'test_rev0004.py' -v
      - run: python tools/review_vtable_candidates.py research/triage/EXP-0017-candidates.json
