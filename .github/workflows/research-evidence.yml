name: Research evidence checks

on:
  push:
    branches: ["research/**", "main"]
  pull_request:

jobs:
  exp0014-index:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate all experiment IDs, statuses and local links
        run: python tools/validate_experiments.py
      - name: Check research documentation links
        run: python tools/check_research_docs_links.py
      - name: Test documentation link checker
        run: python -m unittest discover -s tests -p 'test_docs_links.py' -v
      - name: Verify EXP-0014 report-derived index
        run: python tools/check_exp0014_index.py
