name: Research question
description: Propose a bounded, testable investigation
title: "research: "
labels: [research]
body:
  - type: textarea
    id: question
    attributes:
      label: Research question
      description: State one answerable question, its scope, and what decision the answer would enable.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Known evidence and competing explanations
      description: Cite EXP/build records, separate observations from inference, and name at least one alternative model.
    validations:
      required: true
  - type: textarea
    id: test
    attributes:
      label: Distinguishing experiment and prerequisites
      description: State different predicted results, build/input access, controls, falsifier, and copyright-safe output.
    validations:
      required: true
  - type: textarea
    id: completion
    attributes:
      label: Completion criteria
      description: What small reviewable artifact will close this task? Include commands or evidence links when relevant.
    validations:
      required: true
